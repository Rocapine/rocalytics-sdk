name: Publish

# Publishes to npm via trusted publishing (OIDC): no npm token is stored
# anywhere. npm trusts this exact file (`publish.yml`) in Rocapine/rocalytics-sdk,
# and the `npm` environment, so renaming either breaks publishing.
# Provenance is attached automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - name: Release tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs lint, the test type-check, tests, build and the
      # exports check. A prerelease version (x.y.z-rc.1) goes to `next`, so it
      # never becomes `latest`.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --tag "$tag"

  # Tells roca-chandler (the bot that upgrades consumer apps) about the new
  # version. Separate from `publish` so that job stays exactly what npm trusts.
  # The roca-chandler App token has contents: write there, which
  # POST /repos/{owner}/{repo}/dispatches requires.
  notify-roca-chandler:
    needs: publish
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.ROCA_CHANDLER_APP_ID }}
          private-key: ${{ secrets.ROCA_CHANDLER_PRIVATE_KEY }}
          owner: Rocapine
          repositories: roca-chandler

      - name: Dispatch sdk-released to roca-chandler
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/Rocapine/roca-chandler/dispatches \
            -f event_type=sdk-released \
            -F 'client_payload[sdk]=rocalytics-sdk' \
            -F "client_payload[version]=${GITHUB_REF_NAME#v}"

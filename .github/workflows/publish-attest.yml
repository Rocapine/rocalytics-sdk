name: Publish attest

# Publishes @rocapine/rocalytics-attest (native/attest) on a GitHub release
# tagged attest-v<version>, via npm trusted publishing (OIDC): no npm token is
# stored anywhere. npm trusts this exact file (`publish-attest.yml`) in
# Rocapine/rocalytics-sdk, and the `npm` environment, so renaming either
# breaks publishing. Provenance is attached automatically.
# publish.yml skips attest-v* releases; this workflow skips every other one.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-attest
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ startsWith(github.event.release.tag_name, 'attest-v') }}
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: native/attest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: native/attest/package-lock.json

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - name: Release tag matches native/attest/package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#attest-v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match native/attest/package.json version $version"
            exit 1
          fi

      # --legacy-peer-deps: the expo / expo-modules-core peers come from the
      # app; only the dev toolchain (typescript, expo-modules-core types) is
      # installed here, pinned by native/attest/package-lock.json.
      - run: npm ci --legacy-peer-deps

      - run: npm test

      # npm publish runs prepack, which builds build/ from src/. A prerelease
      # version (x.y.z-rc.1) goes to `next`, so it never becomes `latest`.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --tag "$tag"

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rocapine.attest'
version = '0.1.0'

android {
  namespace "com.rocapine.attest"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Play Integrity, standard requests. Pinned: latest 1.x on Google's Maven.
  implementation "com.google.android.play:integrity:1.6.0"
}
